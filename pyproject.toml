[project]
name = "pipeline-dsia"
version = "0.1.0"
description = "Pipeline de calidad de datos y métricas sobre los precios de carburantes en las gasolineras de España"
readme = "README.md"
authors = [
    { name = "Justo", email = "justoabellas03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
