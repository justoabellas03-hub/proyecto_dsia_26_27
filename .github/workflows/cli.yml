name: CI
 
on:
  push:
    branches: [main]
  pull_request:
 
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
 
      - name: Instalar dependencias
        run: uv sync
 
      - name: Tests con cobertura (mínimo 60 %)
        run: uv run pytest --cov=pipeline_dsia --cov-report=term-missing --cov-fail-under=60